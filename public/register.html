<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT Contoh Jaya — Registrasi</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><a class="brand-mark" href="/"><span>CJ</span></a><nav class="nav" style="display:flex"><a href="/">← Back to home</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><div class="eyebrow">PT Contoh Jaya / Buat Akun</div><h1>Buat akun admin.</h1><p class="auth-note">Daftarkan akun untuk mengakses panel pengelolaan.</p><form id="form-auth" data-mode="register">
<div class="field"><label for="nama">Full name</label><input id="nama" name="nama" autocomplete="name" required maxlength="100"></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="100"></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Minimum 8 characters"></div>
<p id="status-form" class="status" role="status" aria-live="polite"></p><button type="submit" id="tombol-kirim" class="btn btn-primary">Daftar ↗</button></form>
<p class="auth-note">Sudah punya akun? <a href="/login.html">Login</a></p></section></main><script src="/auth.js"></script></body></html>
