<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT Contoh Jaya — Login</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><a class="brand-mark" href="/"><span>CJ</span></a><nav class="nav" style="display:flex"><a href="/">← Back to home</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><div class="eyebrow">PT Contoh Jaya / Login Admin</div><h1>Welcome back.</h1><p class="auth-note">Masuk untuk mengelola layanan PT Contoh Jaya.</p><form id="form-auth" data-mode="login">
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="100"></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<p id="status-form" class="status" role="status" aria-live="polite"></p><button type="submit" id="tombol-kirim" class="btn btn-primary">Login ↗</button></form>
<p class="auth-note">Belum punya akun? <a href="/register.html">Buat akun</a></p></section></main><script src="/auth.js"></script></body></html>
